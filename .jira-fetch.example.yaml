# yaml-language-server: $schema=https://raw.githubusercontent.com/casaper/jira-fetch/main/schema/jira-fetch.schema.json

# Copy to .jira-fetch.yaml and commit it: the filters below then apply to everyone working in
# this project. Credentials do not belong in here — keep JIRA_API_TOKEN in .env.local (which
# your .gitignore should cover), in the environment, or pass --token.

baseUrl: https://your-site.atlassian.net

allowJql: true

filters:
  exclude:
    - project: [SUP]
    - labels: [wontfix, duplicate]
    - field:
        Team: [Platform]
        Components: [api]
    - title:
        matches: '^(spike|chore):'
        flags: i
    # null means "absent": an anonymous portal reporter, an unassigned issue.
    - reporter: [null]
    - assignee: [null]

  comments:
    exclude:
      - author: [Automation for Jira]
