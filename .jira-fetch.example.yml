# yaml-language-server: $schema=https://raw.githubusercontent.com/casaper/jira-fetch/main/schema/jira-fetch.schema.json

# This file has two homes, and they mean different things.
#
# Copied to .jira-fetch.yml and committed, the filters below apply to everyone working in this
# project. Credentials do not belong in a file you commit — keep JIRA_API_TOKEN in .env.local
# (which your .gitignore should cover), in the environment, or pass --token.
#
# Copied to ~/.config/jira-fetch.yaml, it can carry the token as well, and then nothing about
# your Jira access lives in the project at all. That is the setup to use when the caller is an
# agent through `jira-fetch mcp`: point the server at this file with --config <absolute path>,
# so nothing appearing in the project tree can shadow it, and unset JIRA_API_TOKEN, since the
# environment outranks this file. `chmod 600` it. See the MCP server section of the README.

baseUrl: https://your-site.atlassian.net

# Only in the home copy, never in a committed one — the tool warns on every run if a config
# inside a project tree sets this.
# token: ATATT3xFfGF0...

# Also removes the search_issues tool from `jira-fetch mcp`, so an agent cannot run a query either.
allowJql: true

# These are what an agent gets, too. `jira-fetch mcp` serves the same pipeline over MCP and runs
# the same two filter stages, so a ticket excluded here is one it cannot fetch — by configuration
# rather than by instruction. See the MCP server section of the README.
filters:
  exclude:
    - project: [SUP]
    - labels: [wontfix, duplicate]
    # `field` reaches built-in fields as well as custom ones — this is how you filter by type or
    # status. A name that does not resolve, or resolves to two fields, stops the run with exit 2.
    - field:
        Status: [Cancelled, Done]
        Issue Type: [Bug]
    - field:
        Team: [Platform]
        Components: [api]
    - title:
        matches: '^(spike|chore):'
        flags: i
    # null means "absent": an anonymous portal reporter, an unassigned issue.
    - reporter: [null]
    - assignee: [null]

  comments:
    exclude:
      - author: [Automation for Jira]

# How much the document says about people. These are the defaults; delete the block to keep them.
people:
  # Who appears at all. An empty list leaves people out of the document entirely.
  roles: [reporter, assignee, commenter]
  # What is recorded about them, in this order. At least one.
  fields: [name, email]
  # `initials` writes "Kaspar Vollenweider" as "KV", in the frontmatter and comment headings alike.
  nameFormat: full
