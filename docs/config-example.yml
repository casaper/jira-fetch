# yaml-language-server: $schema=https://raw.githubusercontent.com/casaper/jira-fetch/main/schema/jira-fetch.schema.json

# Every option, in one file, for reference. This is not a file you copy into a project — there is
# exactly one config per project and it lives in your own configuration directory:
#
#   ~/.config/jira-fetch/<project-path>.yml      macOS and Linux
#   %APPDATA%\jira-fetch\<project-path>.yml      Windows
#
# `jira-fetch setup` writes it and `jira-fetch config-file` prints its path. Nothing else is read:
# no environment variables, no .env, no config file inside the project, no --config flag. That is
# what lets `filters` below decide an agent's access rather than merely suggest it.

# The repository this configuration governs. Required, and checked against the repository the tool
# is actually running in — two project paths can produce the same filename, and running under
# another project's filters is the one failure this whole layout exists to prevent.
project: /home/you/code/thing

baseUrl: https://your-site.atlassian.net
email: you@example.com

# There is no environment variable and no flag for this. A token here is one a shell in your
# project does not inherit, which is the point: an exported token is one an agent can send to Jira
# with curl, never going through this tool at all.
token: ATATT3xFfGF0...

# Also removes the search_issues tool from `jira-fetch mcp` entirely, rather than having it refuse
# when called — so an agent cannot run a query either.
allowJql: true

# These are what an agent gets, too. `jira-fetch mcp` serves the same pipeline over MCP and runs
# the same two filter stages, so a ticket excluded here is one it cannot fetch — by configuration
# rather than by instruction, and from a file outside the tree it works in. See the MCP server
# section of the README.
filters:
  exclude:
    - project: [SUP]
    - labels: [wontfix, duplicate]
    # `field` reaches built-in fields as well as custom ones — this is how you filter by type or
    # status. A name that does not resolve, or resolves to two fields, stops the run with exit 2.
    - field:
        Status: [Cancelled, Done]
        Issue Type: [Bug]
    - field:
        Team: [Platform]
        Components: [api]
    - title:
        matches: '^(spike|chore):'
        flags: i
    # null means "absent": an anonymous portal reporter, an unassigned issue.
    - reporter: [null]
    - assignee: [null]

  comments:
    exclude:
      - author: [Automation for Jira]

# How much the document says about people. These are the defaults; delete the block to keep them.
people:
  # Who appears at all. An empty list leaves people out of the document entirely.
  roles: [reporter, assignee, commenter]
  # What is recorded about them, in this order. At least one.
  fields: [name, email]
  # `initials` writes "Kaspar Vollenweider" as "KV", in the frontmatter and comment headings alike.
  nameFormat: full
